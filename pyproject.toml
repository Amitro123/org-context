[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "org-context"
version = "0.1.0"
description = "Local evidence-backed repository inventory"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
org-context = "org_context.cli:main"

[tool.setuptools.packages.find]
include = ["org_context*"]
